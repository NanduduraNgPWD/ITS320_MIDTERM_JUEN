<div class="min-h-screen flex justify-evenly items-start bg-white py-10">
    <div class="flex flex-col gap-4 shadow-xl px-15 rounded-2xl text-left w-2/4 py-10">

        <div>
            <div class="mb-8">
                <div class="flex items-center justify-between">
                    <p class="text-2xl font-semibold text-gray-950"> Overview</p>
                    <span (click)="onLogout()" class="material-icons text-gray-700 cursor-pointer">
                        logout
                    </span>
                </div>
                <a routerLink="/todo" target="_blank" rel="noopener noreferrer"
                    class="text-sm gap-2 flex items-center justify-start pt-4">
                    <span class="material-icons text-blue-500 ">add</span>
                    Add new list</a>


            </div>

            <div *ngFor="let list of todoLists" class="mb-6 border-b border-gray-400 pb-2">
                <div class="w-full text-left font-medium text-base mb-2 flex justify-between items-center relative">
                    <button (click)="toggleList(list._id)" class="flex items-center gap-2">
                        <ng-container *ngIf="expandedLists[list._id]; else collapsed">
                            <span class="material-icons text-gray-700">keyboard_arrow_up</span>
                        </ng-container>
                        <ng-template #collapsed>
                            <span class="material-icons text-gray-700">keyboard_arrow_down</span>
                        </ng-template>
                        {{ list.title }}
                    </button>

                    <span class="material-icons text-gray-700 cursor-pointer" (click)="toggleDropdown(list._id)">
                        more_horiz
                    </span>

                    <!-- Dropdown -->
                    <div *ngIf="dropdownOpen[list._id]"
                        class="absolute right-0  top-8 bg-white border text-sm border-gray-200 shadow-[0_-2px_6px_-1px_rgba(0,0,0,0.11)] rounded w-72 z-10">
                        <button (click)="addItemToList(list._id)"
                            class="flex items-center w-full p-4 gap-2 text-left hover:bg-gray-100">
                            <span class="material-icons text-gray-400">add</span>
                            <div>
                                <p class="font-medium"> Add Item</p>
                                <p class="text-[11.8px] text-gray-400 font-normal">Insert a new task in this list</p>
                            </div>
                        </button>
                        <button (click)="deleteList(list._id)"
                            class="flex items-center w-full p-4 gap-2 text-left hover:bg-gray-100">
                            <span class="material-icons text-gray-400">delete</span>
                            <div>
                                <p class="font-medium"> Delete list</p>
                                <p class="text-[11.8px] text-gray-400 font-normal">This will remove the whole list</p>
                            </div>

                        </button>
                    </div>
                </div>


                <ul *ngIf="expandedLists[list._id]">
                    <li *ngFor="let item of list.items; let i = index"
                        class="flex justify-between items-center px-2 py-1   mb-1"
                        [ngClass]="{ 'bg-green-500 text-white': item.completed }">

                        <div class="flex items-center gap-2">
                            <input type="checkbox" class="h-4 w-4 bg-white border-2"
                                (click)="handleClick(list._id); toggleCompleted(list._id, i)"
                                [checked]="item.completed" />


                            <!-- Editable input -->
                            <input class=" rounded p-1 w-full"
                                [disabled]="!(editingItem?.listId === list._id && editingItem?.itemIndex === i)"
                                [(ngModel)]="item.text"
                                [ngClass]="{ 'border-blue-500 border': editingItem?.listId === list._id && editingItem?.itemIndex === i }" />


                            <span *ngIf="!item.completed" class="text-base ml-2 px-2 py-1 rounded-md " [ngClass]="{
                    'text-[#83dda6] bg-[#e3f4ea]': item.priority === 'Low',
                    'text-orange-300 bg-orange-100': item.priority === 'Medium',
                    'text-red-300 bg-red-100': item.priority === 'High'
                  }">
                                {{ item.priority }}
                            </span>
                        </div>

                        <div class="flex items-center gap-2">
                            <span
                                class="material-icons custom-icon text-gray-500 cursor-pointer bg-gray-100 rounded-full text-sm"
                                (click)="enableTextEdit(list._id, i)">edit_note</span>

                            <span (click)="deleteItem(list._id, i)"
                                class="material-icons custom-icon cursor-pointer bg-gray-400 rounded-full"
                                [ngClass]="item.completed ? 'text-blue-500 bg-white' : 'text-gray-100'">
                                delete_forever
                            </span>
                        </div>
                    </li>

                    <div class="flex justify-end gap-2 flex-row mt-2">

                        <div *ngIf="clickedItems[list._id]" class="text-right">
                            <button
                                class="text-sm text-green-600 border border-green-500 px-3 py-1 rounded hover:bg-blue-50 transition"
                                (click)="saveCompletedStatus(list._id)">
                                Update status
                            </button>
                        </div>

                        <div *ngIf="editingItem?.listId === list._id" class="text-right">
                            <button
                                class="text-sm text-blue-600 border border-blue-500 px-3 py-1 rounded hover:bg-blue-50 transition"
                                (click)="saveUpdatedText(list._id)">
                                Save changes
                            </button>
                        </div>
                    </div>

                </ul>
            </div>

            <!-- modal -->
            <div *ngIf="showAddItemModal"
                class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50">
                <div class="bg-white p-6 rounded-lg w-80 shadow-xl">
                    <h2 class="text-lg font-semibold mb-4">Add New Item</h2>
                    <label class="block text-sm mb-1">Task</label>
                    <input [(ngModel)]="newItemText" class="w-full border p-2 rounded mb-4"
                        placeholder="Enter task..." />

                    <label class="block text-sm mb-1">Priority</label>
                    <select [(ngModel)]="newItemPriority" class="w-full border p-2 rounded mb-4">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>

                    <div class="flex justify-end gap-2">
                        <button class="px-4 py-1 border rounded hover:bg-gray-100"
                            (click)="closeModal()">Cancel</button>
                        <button class="px-4 py-1 bg-blue-600 text-white rounded hover:bg-blue-700"
                            (click)="submitNewItem()">Add</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<style>
    .custom-icon {
        font-size: 20px !important;
        padding: 2px;
    }
</style>
