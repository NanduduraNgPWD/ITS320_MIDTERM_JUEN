<!-- login.component.html with Tailwind CSS -->
<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4 py-12">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login</h2>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Email Field -->
            <div class="space-y-2">
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" formControlName="email"
                    class="w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    [ngClass]="{ 'border-red-500 ring-red-500': submitted && f['email'].errors }" />
                <div *ngIf="submitted && f['email'].errors" class="text-red-500 text-sm mt-1">
                    <div *ngIf="f['email'].errors['required']">Email is required</div>
                    <div *ngIf="f['email'].errors['email']">Please enter a valid email</div>
                </div>
            </div>

            <!-- Password Field -->
            <div class="space-y-2">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" formControlName="password"
                    class="w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    [ngClass]="{ 'border-red-500 ring-red-500': submitted && f['password'].errors }" />
                <div *ngIf="submitted && f['password'].errors" class="text-red-500 text-sm mt-1">
                    <div *ngIf="f['password'].errors['required']">Password is required</div>
                    <div *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</div>
                </div>
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit" [disabled]="loading"
                    class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 focus:ring-blue-500 focus:ring-offset-blue-200 text-white font-medium rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 transition duration-150 ease-in-out disabled:opacity-50">
                    <span *ngIf="loading"
                        class="inline-block h-4 w-4 mr-2 animate-spin rounded-full border-2 border-solid border-current border-r-transparent align-[-0.125em]"></span>
                    Login
                </button>
            </div>

            <!-- Error Message -->
            <div *ngIf="errorMessage" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded">
                {{ errorMessage }}
            </div>

            <!-- Register Link -->
            <div routerLink="/register" class="text-center text-sm text-gray-600">
                Don't have an account?
                <a routerLink="/register" class="font-medium text-blue-600 hover:text-blue-500 underline">
                    Register
                </a>
            </div>
        </form>
    </div>
</div>
